[package]
name = "app-rust"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
chrono = "0.4.45"
futures = "0.3.34"
hex = "0.4.3"
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "time"] }
uuid = { version = "1.23.5", features = ["v4"] }

[profile.release]
strip = true
